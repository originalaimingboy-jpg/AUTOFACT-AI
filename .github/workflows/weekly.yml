name: AUTOFACT AI - Weekly Shorts

on:
  schedule:
    - cron: "30 3 * * 0"
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: autofact-weekly
  cancel-in-progress: false

jobs:
  create-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate or resume Short
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_FALLBACK_MODEL: ${{ vars.GEMINI_FALLBACK_MODEL }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          VIDEO_LANGUAGE: Hinglish
          VIDEO_SECONDS: "35"
          VOICE_NAME: hi-IN-MadhurNeural
          OUTPUT_DIR: work
          AUTOFACT_RETRY_ONLY: ${{ github.event.schedule == '0 */3 * * *' }}
        run: python main.py

      - name: Save progress and topic history
        if: always()
        run: |
          git config user.name "autofact-ai[bot]"
          git config user.email "autofact-ai[bot]@users.noreply.github.com"

          git add -A -- used_topics.json

          if [ -f autofact_state.json ]; then
            git add autofact_state.json
          else
            git rm --cached --ignore-unmatch autofact_state.json
          fi

          if ! git diff --cached --quiet; then
            git commit -m "chore: save AUTOFACT progress"
            git push
          fi

      - name: Upload generated MP4 as backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autofact-output
          path: work/*.mp4
          if-no-files-found: ignore
          retention-days: 7