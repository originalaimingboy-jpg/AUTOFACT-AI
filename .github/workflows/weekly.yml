name: AUTOFACT AI — Weekly Shorts

on:
  schedule:
    # Sunday 09:00 India time (03:30 UTC). GitHub schedules may be delayed.
    - cron: "30 3 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: autofact-weekly
  cancel-in-progress: false

jobs:
  create-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate and upload one Short
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          VIDEO_LANGUAGE: Hinglish
          VIDEO_SECONDS: "52"
          VOICE_NAME: hi-IN-MadhurNeural
          OUTPUT_DIR: work
        run: python main.py

      - name: Commit topic history
        if: success()
        run: |
          git config user.name "autofact-ai[bot]"
          git config user.email "autofact-ai[bot]@users.noreply.github.com"
          git add used_topics.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update AUTOFACT topic history"
            git push
          fi

      - name: Upload generated MP4 as a backup artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autofact-output
          path: work/*.mp4
          if-no-files-found: ignore
          retention-days: 7
